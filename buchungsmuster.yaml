# Wissensspeicher des Fibu-Baukastens: Buchungsmuster, die geprüft sind.
# muster: Rollen statt Kontonummern (BESTAND = 2000/2010/2020/2030/2280, AUFW = 6000/6010/6020/6030/6080, BEZUG_* = Unterkonto Bezugskosten,
#         NACHL_* = Unterkonto Nachlässe, VST = 2600, UST = 4800, VERB = 4400, FORD = 2400, BANK = 2800, KASSE = 2880, EBK = 8000, SBK = 8010,
#         GUV = 8020, ERLOES = 5000/5100 …; andere Konten stehen mit ihrer Nummer). S = Soll, H = Haben.
# status: verifiziert (gegen Lösungsvorschläge oder Freigabe der Lehrkraft) | neu (noch nicht bestätigt)
# Neue Themen: python3 skripte/buchungspruefung.py <ordner> --lernen trägt unbekannte Muster als „neu“ ein. Erst wenn die Lehrkraft sie
# bestätigt hat (Lösungsvorschlag, Buch, Klassenarbeit), setzt man status: verifiziert und trägt name, technik und quelle ein.
- muster: S:AUFW+VST > H:VERB
  name: Werkstoffeinkauf auf Ziel
  technik: aufwandsorientiert
  quelle: LS 52 Lösungsvorschläge (Cornelsen, Industriekaufleute 1, Lernfeld 5), Aufgabe 1 und 6
  status: verifiziert
  thema: beschaffung
- muster: S:BESTAND+VST > H:VERB
  name: Werkstoffeinkauf auf Ziel
  technik: bestandsorientiert
  quelle: LS 52 Lösungsvorschläge (Cornelsen, Industriekaufleute 1, Lernfeld 5), Aufgabe 1 und 6
  status: verifiziert
  thema: beschaffung
- muster: S:AUFW+BEZUG_A+VST > H:VERB
  name: Einkauf mit Bezugskosten in der Rechnung
  technik: aufwandsorientiert
  quelle: LS 52 Lösungsvorschläge (Cornelsen, Industriekaufleute 1, Lernfeld 5), Aufgabe 2
  status: verifiziert
  thema: beschaffung
- muster: S:BESTAND+BEZUG_B+VST > H:VERB
  name: Einkauf mit Bezugskosten in der Rechnung
  technik: bestandsorientiert
  quelle: LS 52 Lösungsvorschläge (Cornelsen, Industriekaufleute 1, Lernfeld 5), Aufgabe 2
  status: verifiziert
  thema: beschaffung
- muster: S:BEZUG_A+VST > H:VERB
