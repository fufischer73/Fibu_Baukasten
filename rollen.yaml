# Rollen der Konten in Buchungssätzen (Datenbasis für skripte/buchungspruefung.py und skripte/wissen_aufnehmen.py).
# Aus „2400 an 5000, 4800“ wird das Muster „S:FORD > H:ERLOES+UST“. Das Muster zählt, nicht die Kontonummer: So gilt „Einkauf auf Ziel“
# für alle Werkstoffkonten (Rohstoffe, Fremdbauteile, Hilfsstoffe, Betriebsstoffe, Handelswaren).
#
# `muster` ist ein regulärer Ausdruck für die ganze vierstellige Kontonummer. Die ERSTE passende Zeile gewinnt (Reihenfolge zählt!).
# Ein Konto ohne Rolle steht mit seiner Nummer im Muster. Neue Konten brauchen also nur dann eine Zeile, wenn sie zu einem Muster
# gehören, das für mehrere Konten gelten soll. Danach  python3 skripte/buchungspruefung.py <ordner>  neu laufen lassen.
rollen:
  - {muster: "2(000|010|020|030|280)", rolle: BESTAND,   name: "Werkstoffe und Waren im Bestand (bestandsorientiert)"}
  - {muster: "2(001|011|021|031|281)", rolle: BEZUG_B,   name: "Unterkonto Bezugskosten (Bestand)"}
  - {muster: "2(002|012|022|032|282)", rolle: NACHL_B,   name: "Unterkonto Nachlässe (Bestand)"}
  - {muster: "6(000|010|020|030|080)", rolle: AUFW,      name: "Aufwendungen für Werkstoffe und Waren (aufwandsorientiert)"}
  - {muster: "6(001|011|021|031|081)", rolle: BEZUG_A,   name: "Unterkonto Bezugskosten (Aufwand)"}
  - {muster: "6(002|012|022|032|082)", rolle: NACHL_A,   name: "Unterkonto Nachlässe (Aufwand)"}
  - {muster: "2600", rolle: VST,       name: "Vorsteuer"}
  - {muster: "4800", rolle: UST,       name: "Umsatzsteuer"}
  - {muster: "4400", rolle: VERB,      name: "Verbindlichkeiten a. L. L."}
  - {muster: "2400", rolle: FORD,      name: "Forderungen a. L. L."}
  - {muster: "2800", rolle: BANK,      name: "Bank"}
  - {muster: "2880", rolle: KASSE,     name: "Kasse"}
  - {muster: "8000", rolle: EBK,       name: "Eröffnungsbilanzkonto"}
  - {muster: "8010", rolle: SBK,       name: "Schlussbilanzkonto"}
  - {muster: "8020", rolle: GUV,       name: "GuV-Konto"}
  - {muster: "5(001|101)", rolle: ERLBER, name: "Erlösberichtigungen (Erzeugnisse und Waren)"}
  - {muster: "5[01]\\d\\d", rolle: ERLOES, name: "Umsatzerlöse (Erzeugnisse und Waren)"}
  - {muster: "6040", rolle: VERPACK,   name: "Aufwendungen für Verpackungsmaterial"}
  - {muster: "6140", rolle: FRACHT,    name: "Frachten und Fremdlager"}
  - {muster: "6150", rolle: PROVISION, name: "Vertriebsprovisionen"}
