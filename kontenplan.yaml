# Zentraler Kontenplan des Fibu-Baukastens (Schulplan der Lehrkraft, ergänzt um Konten aus Lösungen und dem Industriekontenrahmen).
#
# So wird er benutzt:
# - Alle Lernpfade laden ihn automatisch. Ein `kontenplan:` in der kurs.yaml ist nur noch für Ergänzungen oder Abweichungen nötig
#   (dort Eingetragenes überschreibt diese Datei).
# - Bei jedem neuen Lerninhalt prüft `python3 skripte/kontenpruefung.py <ordner>`, ob alle verwendeten Konten hier stehen.
#   Für Konten aus Material: `python3 skripte/kontenpruefung.py --liste 5001 5101 …`.
# - Neue Konten: `python3 skripte/kontenpruefung.py --aufnehmen 5001="Name" --quelle "…"` (Status „neu“), nach Bestätigung durch die
#   Lehrkraft `--bestaetigen 5001` (Status „verifiziert“).
#
# Regeln: Die Bezeichnungen des SCHULPLANS gelten. Der Industriekontenrahmen (IKR) ergänzt nur fehlende Konten.
# Abweichende Schreibweisen aus Lösungen oder alten Pfaden stehen unter `alias`.
# art: bestand | erfolg | abschluss. status: verifiziert (Lehrkraft, Lösungsvorschläge oder Kontenrahmen) | neu (noch nicht bestätigt).
konten:
