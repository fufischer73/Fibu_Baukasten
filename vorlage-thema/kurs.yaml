moodle:
  version: 4                    # BBZ-Moodle 4.5.12
  unterabschnitte: stufen       # ein Abschnitt, darin je Stufe ein Unterabschnitt (Plugin „Unterabschnitt“ am BBZ)
  unterabschnitt_name: "Übungs-Lernpfad @@THEMA@@"
  start: false                  # kein Start-Lernpaket (der Pfad kommt in einen vorhandenen Kurs)
  anordnung: true               # Fragetyp „Reihenfolge“ ab Moodle 4.4
  freischaltung: offen          # beide Stufen sofort frei (niemand wird „eingestuft“)
  reihenfolge: frei
  # abschnitt: <Nummer>         # nur nötig, wenn die Abschnittsnummer bekannt ist; sonst Wiederherstellen und Unterabschnitt verschieben

tests:
  - id: test-@@KURZNAME@@
    titel: "Abschlusstest: @@THEMA@@"
    stufe: pruefung
    fragen: test-@@KURZNAME@@
    punkte: 20
    versuche: 0
    zeit: 0
    pro_seite: 1
    mischen: false
    feedback: nachher
    text: |
      Belege lesen, Beträge berechnen und Buchungssätze bilden. Du darfst den Test wiederholen.
      Die offene Frage bewertet deine Lehrkraft von Hand.
