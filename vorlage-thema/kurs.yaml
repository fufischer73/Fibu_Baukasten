# Kursbeschreibung – @@THEMA@@ (Industriekaufleute, BBZ, Moodle 4.5)
# Aufbau und alle Felder: referenzen/schema.md. Alles mit @@ … @@ wird von neues_thema.py ersetzt.
# Diese Vorlage ist ein lauffähiges Beispiel. Inhalte (Module, Belege, Fragen) sind BEISPIELE und werden ersetzt.

titel: "@@THEMA@@"
kurzname: @@KURZNAME@@
ueberschrift: "@@THEMA@@ – dein Wissen im Check"
untertitel: Du hast das Thema erarbeitet. Hier übst du an Belegen und prüfst, ob Verständnis, Berechnungen und Buchungssätze sitzen.
badges: [Industriekaufleute, Lernfeld @@LERNFELD@@, ca. @@STUNDEN@@ Unterrichtsstunden]
fusszeile: BBZ Rendsburg-Eckernförde

einleitung: |
  :::notiz 👉 Bevor du startest
  1. Du hast das Thema schon erarbeitet. Dieser Pfad hilft dir beim Üben und prüft, was sitzt.
  2. **Fällt dir das Thema schwer?** Beginne bei **🌱 Schritt für Schritt**. Dort lernst du in kleinen Schritten mit Beispielen und vielen Hilfen.
  3. **Fühlst du dich sicher?** Gehe direkt zu **🎯 Überprüfung**.
  4. Du arbeitest mit Belegen der **Wiesengrund Küchenmöbel GmbH**. Die Konten und das Unternehmen findest du in den Hilfen zum Aufklappen.
  5. Jede Buchungsaufgabe sagt dir, ob du **aufwandsorientiert** oder **bestandsorientiert** buchst (wenn das Thema es braucht).
  6. Zum Schluss wartet der **Abschlusstest**. Du darfst ihn wiederholen.
  7. Unter **📚 Nachschlagen** findest du alle Hilfen.
  :::

stufen:
  - id: foerderung
    name: Schritt für Schritt
    icon: "🌱"
    text: Das Thema in kleinen Schritten mit Beispielen, Hilfen und Merkzettel. Für alle, die noch Sicherheit brauchen.
    module: [f1]
  - id: pruefung
    name: Überprüfung
    icon: "🎯"
    text: Belege lesen, rechnen und buchen wie in der Klassenarbeit.
    module: [u1]
  - id: nachschlagen
    name: Nachschlagen
    icon: "📚"
    text: Hilfen, Schemata und ein Hilfsblatt zum Ausdrucken. Ohne Aufgaben, jederzeit erreichbar.
    module: [n1]

# Kontenplan: kommt automatisch aus kontenplan.yaml im Baukasten (Schulplan der Lehrkraft, ergänzt um Konten aus Lösungen und IKR).
# Hier nur eintragen, was für dieses Thema abweicht oder fehlt (Nummern immer in Anführungszeichen, 0700 wäre sonst eine Oktalzahl):
# kontenplan:
#   "5001": Erlösberichtigungen f. eigene Erzeugnisse
# Fehlende Konten besser zentral aufnehmen: python3 skripte/kontenpruefung.py --aufnehmen 5001="…" --quelle "…"
#
# Kurzer Satz „Wofür?“ zu Konten für die erzeugte Kontenübersicht (python3 skripte/kontenuebersicht.py <ordner> --schreiben):
# konten_hinweise:
#   "5000": Verkauf von Erzeugnissen. Hier wird auch die Rücksendung gebucht.

moodle:
  version: 4                    # BBZ-Moodle 4.5.12
  unterabschnitte: stufen       # ein Abschnitt, darin je Stufe ein Unterabschnitt (Plugin „Unterabschnitt“ am BBZ)
  unterabschnitt_name: "Übungs-Lernpfad @@THEMA@@"
  start: false                  # kein Start-Lernpaket (der Pfad kommt in einen vorhandenen Kurs)
  anordnung: true               # Fragetyp „Reihenfolge“ ab Moodle 4.4
  freischaltung: offen          # beide Stufen sofort frei (niemand wird „eingestuft“)
  reihenfolge: frei
  # abschnitt: <Nummer>         # nur nötig, wenn die Abschnittsnummer bekannt ist; sonst Wiederherstellen und Unterabschnitt verschieben

tests:
  - id: test-@@KURZNAME@@
    titel: "Abschlusstest: @@THEMA@@"
    stufe: pruefung
    fragen: test-@@KURZNAME@@
    punkte: 20
    versuche: 0
    zeit: 0
    pro_seite: 1
    mischen: false
    feedback: nachher
    text: |
      Belege lesen, Beträge berechnen und Buchungssätze bilden. Du darfst den Test wiederholen.
      Die offene Frage bewertet deine Lehrkraft von Hand.
