# Kursbeschreibung – @@THEMA@@ (Industriekaufleute, BBZ, Moodle 4.5)
# Aufbau und alle Felder: referenzen/schema.md. Alles mit @@ … @@ wird von neues_thema.py ersetzt.
# Diese Vorlage ist ein lauffähiges Beispiel. Inhalte (Module, Belege, Fragen) sind BEISPIELE und werden ersetzt.

titel: "@@THEMA@@"
kurzname: @@KURZNAME@@
ueberschrift: "@@THEMA@@ – dein Wissen im Check"
untertitel: Du hast das Thema erarbeitet. Hier übst du an Belegen und prüfst, ob Verständnis, Berechnungen und Buchungssätze sitzen.
badges: [Industriekaufleute, Lernfeld @@LERNFELD@@, ca. @@STUNDEN@@ Unterrichtsstunden]
fusszeile: BBZ Rendsburg-Eckernförde

einleitung: |
  :::notiz 👉 Bevor du startest
  1. Du hast das Thema schon erarbeitet. Dieser Pfad hilft dir beim Üben und prüft, was sitzt.
  2. **Fällt dir das Thema schwer?** Beginne bei **🌱 Schritt für Schritt**. Dort lernst du in kleinen Schritten mit Beispielen und vielen Hilfen.
  3. **Fühlst du dich sicher?** Gehe direkt zu **🎯 Überprüfung**.
  4. Du arbeitest mit Belegen der **Wiesengrund Küchenmöbel GmbH**. Die Konten und das Unternehmen findest du in den Hilfen zum Aufklappen.
  5. Jede Buchungsaufgabe sagt dir, ob du **aufwandsorientiert** oder **bestandsorientiert** buchst (wenn das Thema es braucht).
  6. Zum Schluss wartet der **Abschlusstest**. Du darfst ihn wiederholen.
  :::

stufen:
  - id: foerderung
    name: Schritt für Schritt
    icon: "🌱"
    text: Das Thema in kleinen Schritten mit Beispielen, Hilfen und Merkzettel. Für alle, die noch Sicherheit brauchen.
    module: [f1]
  - id: pruefung
    name: Überprüfung
    icon: "🎯"
    text: Belege lesen, rechnen und buchen wie in der Klassenarbeit.
    module: [u1]

